name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --configuration release --disable-sandbox
      - name: Test
        run: swift test --disable-sandbox
      - name: Hardware-safe self-test
        run: .build/release/Searoom --self-test
      - name: CLI command smoke
        run: |
          .build/release/Searoom help
          .build/release/Searoom version
          .build/release/Searoom schema > /dev/null
          .build/release/Searoom metrics --json > /dev/null
          .build/release/Searoom agent-guide > /dev/null
      - name: Package app
        run: Scripts/build-app.sh
      - name: Packaged CLI and symlink gate
        run: |
          APP_CLI="dist/Searoom.app/Contents/MacOS/Searoom"
          "$APP_CLI" self-test
          "$APP_CLI" metrics > /dev/null
          "$APP_CLI" --dump-sample > /dev/null
          LINK_DIR="$(mktemp -d)"
          ln -s "$(cd dist/Searoom.app/Contents/MacOS && pwd)/Searoom" "$LINK_DIR/searoom"
          "$LINK_DIR/searoom" help > /dev/null
          "$LINK_DIR/searoom" schema > /dev/null
          "$LINK_DIR/searoom" metrics --json > /dev/null
          "$LINK_DIR/searoom" sample --pretty > /dev/null
          "$LINK_DIR/searoom" watch --count 2 > /dev/null
          "$LINK_DIR/searoom" capabilities --pretty > /dev/null
          "$LINK_DIR/searoom" history --limit 2 > /dev/null
          # The symlink is how Homebrew and install-cli expose the command, so
          # the version reported through it must match the bundle rather than
          # the placeholder. Asserted here because every telemetry document
          # carries searoomVersion.
          EXPECTED="$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)"
          REPORTED="$("$LINK_DIR/searoom" version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["searoomVersion"])')"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "searoom version through a symlink reported $REPORTED, expected $EXPECTED" >&2
            exit 1
          fi
          # watch must finish its line and exit 128 + signal. A shell cannot
          # check this: bash reports 130 both for a process killed by SIGINT
          # and for one that exits 130.
          python3 Scripts/check-watch-signal.py "$APP_CLI"
      - name: Upload unsigned development build
        uses: actions/upload-artifact@v4
        with:
          name: Searoom-development
          path: dist/Searoom.app
